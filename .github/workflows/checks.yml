# Structural lint + every sensitivity fixture, on every push and pull request.
#
# WHY (#115): twelve lint rules and twelve gating fixture suites existed for months and
# gated nothing. CLAUDE.md said to run them; running them was a thing someone had
# to remember, and the choice of WHICH ones to run was the author's — the same act
# the anti-self-certification constraint is about, one level up. #105/#112 is what
# that produces: a shell syntax error in an adopter-facing block, shipped for eight
# releases, in a repo with a green suite.
#
# WHAT THIS DOES NOT CHECK, and must never be reported as checking:
#   - the cross-step contracts between skill steps (#113) — no instrument exists
#   - rule 12, whose name list is untracked by design: it skips here every time
#   - anything requiring judgement: /review-changes is still the diff-driven step
#   - tests/fixtures/review-bench/, which SCORES a review config and has no
#     pass/fail by design. It is declared a non-gate in tests/run-fixtures.sh
# A green run here means "the deterministic checks that exist all passed", which
# this repo's own record says has never once been sufficient.
#
# No path filters, deliberately. Scoping suites to the paths they cover would save
# ~2 minutes (the whole set is ~2m15s wall clock, ~110s of it verify-runner) and
# would buy back exactly the selection mechanism this workflow exists to remove.
name: checks

# TRIGGERS (#124). `push:` is unfiltered on purpose — this repo merges locally and
# rarely opens PRs, so filtering to master would leave branch work ungated. That
# double-ran a same-repo PR branch: push and pull_request produce different
# `github.ref` values, so the concurrency groups differ and neither cancels the
# other. The jobs below therefore skip `pull_request` when the head repo IS this
# repo, since `push` has already covered that commit. A FORK's PR still runs here,
# and it is the only case `push` cannot see.
# ⚠️ A tag push still triggers its own run. That is left alone: the release
# protocol pushes a tag at a commit CI has already tested, so the extra run is
# redundant rather than wrong, and suppressing it would need a filter that could
# also suppress a first-push-of-a-branch.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: structural lint
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by digest, not by the moving v4 tag (#124). Bump deliberately:
      #   gh api repos/actions/checkout/git/ref/tags/v4 --jq .object.sha
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: tests/lint/run.sh
        run: |
          set -o pipefail
          bash tests/lint/run.sh 2>&1 | tee lint.log

      - name: Report what was skipped
        if: ${{ !cancelled() }}
        run: |
          # `tee` creates lint.log before the script runs, so the file existing proves
          # nothing — a run that died on line 1 leaves an empty log, and reporting
          # "no rules skipped, all twelve ran" over it is the instrument agreeing with
          # itself. Gate on the run's own terminal line instead.
          [ -f lint.log ] || exit 0
          if ! grep -qE '^(All lint checks passed\.|[0-9]+ issue\(s\) found\.)' lint.log; then
            {
              echo "### Structural lint"
              echo
              echo "⚠️ The lint never reached its summary line — **this run measured nothing.**"
              echo "Read the step log; do not read the job result as coverage."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Structural lint"
            echo
            if grep -q 'SKIPPED' lint.log; then
              echo "Rules that checked **nothing** on this runner:"
              echo
              echo '```'
              grep 'SKIPPED' lint.log
              echo '```'
              echo
              echo "**A skipped rule is not a passed rule.** The expected skips here are"
              echo "rule 2 (\`memory/\` is gitignored maintainer-local state, so there is no"
              echo "index to check) and rule 12 (its private-name list cannot be tracked"
              echo "without publishing exactly what it protects). ⚠️ **Any OTHER skip in the"
              echo "block above is unexpected and should be read as a defect** — rule 1 skips"
              echo "outside a git work tree (#125), which a CI checkout is not, so seeing it"
              echo "here means the checkout is not what this workflow assumes."
              echo
              echo "Rule 2 is checkable locally, where \`memory/\` exists. **Rule 12 skips"
              echo "locally too** for anyone without \`~/.config/agent-ready/private-names\` —"
              echo "the list is untracked, so the only machine where it runs is one that has"
              echo "generated it. Giving CI the list via a secret is possible and was not done."
            else
              echo "No rules skipped — all twelve ran."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  fixtures:
    name: sensitivity fixtures
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned by digest, not by the moving v4 tag (#124). Bump deliberately:
      #   gh api repos/actions/checkout/git/ref/tags/v4 --jq .object.sha
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: tests/run-fixtures.sh
        run: |
          set -o pipefail
          bash tests/run-fixtures.sh 2>&1 | tee fixtures.log

      - name: Report what ran and what did not
        if: ${{ !cancelled() }}
        run: |
          # Same reasoning as the lint job's summary: `tee` creates the file before
          # the script runs, so its existence proves nothing. Gate on the runner's
          # own terminal line, and say so when it never arrived (#124).
          [ -f fixtures.log ] || exit 0
          {
            echo "### Sensitivity fixtures"
            echo
            if grep -qE '^[0-9]+ of [0-9]+ fixture suite\(s\) executed' fixtures.log; then
              echo '```'
              grep -E '^[0-9]+ of [0-9]+ fixture suite\(s\) executed' fixtures.log
              echo '```'
              echo
              if grep -q 'declared not-a-gate' fixtures.log; then
                echo "One suite is a **declared non-gate**: \`tests/fixtures/review-bench/\`"
                echo "scores a review configuration and has no pass/fail by design. It did"
                echo "**not** pass — it was not asked to. Everything else is a real gate."
              fi
            else
              echo "⚠️ The runner never reached its summary line — **this run measured nothing.**"
              echo "Read the step log; do not read the job result as coverage."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
